name: TeamCombat
version: 1.0.0
main: com.teamcombat.TeamPlugin
api-version: '1.20'
description: Team system with friendly-fire protection and combat tag
commands:
  team:
    description: Team commands
    aliases: [t, teams]
  tc:
    description: Send a team chat message
    aliases: [teamchat]
permissions:
  teamcombat.use:
    default: true
  teamcombat.admin:
    default: op
